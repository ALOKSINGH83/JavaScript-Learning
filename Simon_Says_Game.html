<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="Simon_Says_Game.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h3>Press any key to start the game</h3>
    <div class="score">
        <h4>Highest Score: <span id="highest">0</span></h4>
        <h4>Current Score: <span id="current">0</span></h4>
    </div>
    <div class="box-container">
        <div class="line-one">
            <div class="btn red" type="button" id="red"></div>
            <div class="btn green" type="button" id="green"></div>
        </div>
        <div class="line-two">
            <div class="btn yellow" type="button" id="yellow"></div>
            <div class="btn blue" type="button" id="blue"></div>
        </div>
    </div>
    <script src="Simon_Says_Game.js"></script>
</body>
</html>
